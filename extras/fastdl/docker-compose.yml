# Optional FastDL host.
#
# RAGE:MP can serve client_packages from an external HTTP server instead of the
# game port. That saves bandwidth and speeds up the first connection for big
# client packages.
#
# How to use:
#   1. In .env: RAGE_CREATE_FASTDL_SNAPSHOT=true and (later) RAGE_FASTDL_HOST=http://YOUR_IP:22007
#   2. Start the server once so server-data/fastdl gets generated.
#   3. cd extras/fastdl && docker compose up -d
#   4. Reload the server: make restart
#
# Note: every time client_packages change, regenerate the snapshot (restart the
# server) so the DL folder matches what players are told to download.

name: ragemp-fastdl

services:
  fastdl:
    image: nginx:alpine
    container_name: ragemp-fastdl
    restart: unless-stopped
    ports:
      - "22007:80"
    volumes:
      - ../../server-data/fastdl:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
