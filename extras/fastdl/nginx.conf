server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    autoindex on;

    # Client packages are immutable per build; let the browser keep them.
    location ~* \.(?:js|json|png|jpg|jpeg|gif|webp|dds|ytd|rpf|xml|html|css)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Do not leak the nginx version.
    server_tokens off;

    # Packages can be large; allow big uploads of nothing, but log sanely.
    client_max_body_size 1m;
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
